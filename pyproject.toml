[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "mth2210"
version = "0.1.2"
authors = [{name = "Antonin Paquette-Rufiange"}]
maintainers = [
  {name = "Antonin Paquette-Rufiange", email = "antonin.paquette-rufiange@polymtl.ca"}
]
readme = "README.md"
license = "MIT"
license-files = ["LICEN[CS]E*"]
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.4.0",
    "scipy>=1.17.1"]

[project.urls]
Homepage = "https://github.com/AntoninPaquette/MTH2210.py"

[project.optional-dependencies]
test = ["pytest==9.0.3"]
docs = ["matplotlib>=3.10.6", "pandas[output-formatting]>=3.0", "sphinx==9.1", "myst-parser==5.0.0", "pydata-sphinx-theme==0.17.0", "jupyter-sphinx==0.5.3", "myst-nb==1.4.0"]
dev = ["mth2210[test,docs]"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-v"]

[tool.setuptools.packages]
find = {}
